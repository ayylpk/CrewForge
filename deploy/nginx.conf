# CrewForge 前端站点 + API 反代
# 前端用相对路径 /api/... 调后端（见 frontend/src/api/*.ts），因此这里统一反代。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端构建产物很大（monaco 等），放开上传/响应上限
    client_max_body_size 32m;

    # 后端 API
    # 生产构建把 VITE_API_BASE 配成空串（见 frontend/.env.production），
    # 前端发的是同源相对路径 /api/...，由这一段反代到后端。
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长任务：生成项目可能跑几十分钟，别让 nginx 先超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 注：原来这里还有 /ws/ 与 /files/ 两段，都是死配置，已删——
    #   /ws/   后端没有任何 WebSocket handler（server/pom.xml 里那个
    #          spring-boot-starter-websocket 同样零引用），前端也是纯轮询；
    #   /files/ 后端没有这个前缀的路由，zip 下载走的是 /api/project/{id}/download。

    # SPA 兜底：未知路径回 index.html（前端路由自己处理）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 的文件名可长缓存）
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
