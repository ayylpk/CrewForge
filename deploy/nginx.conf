# CrewForge 前端站点 + API 反代
# 前端用相对路径 /api/... 调后端（见 fronted-CrewForge/src/api/*.ts），因此这里统一反代。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端构建产物很大（monaco 等），放开上传/响应上限
    client_max_body_size 32m;

    # 后端 API
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长任务：生成项目可能跑几十分钟，别让 nginx 先超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WebSocket（后端依赖 spring-boot-starter-websocket：看板/进度推送）
    location /ws/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # 产物下载（证据包/生成项目 zip 之类）走同一后端
    location /files/ {
        proxy_pass http://app:8080;
        proxy_read_timeout 3600s;
    }

    # SPA 兜底：未知路径回 index.html（前端路由自己处理）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 的文件名可长缓存）
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
